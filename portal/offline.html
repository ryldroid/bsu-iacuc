<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Offline - BSU-IACUC</title>

  <link rel="stylesheet" href="assets/css/body.css">
  <link rel="stylesheet" href="assets/css/404.css">
</head>

<body>
  <main>
    <div>
      <h1>You're Offline</h1>
      <p>This page hasn't been loaded before, so it isn't available without an internet connection.</p>
      <p class="helper-note">Pages you've already visited (like your dashboard or protocol list) should still work. Try
        going back.</p>
      <a href="javascript:history.back()" class="button">← Go Back</a>
      <a href="javascript:location.reload()" class="button">Try Again</a>
    </div>
  </main>

  <script>
    window.addEventListener('online', () => location.reload());
  </script>
</body>

</html>
